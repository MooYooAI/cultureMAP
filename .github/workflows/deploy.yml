name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # 매일 오전 6시, 오후 6시(한국 시간)에 데이터를 새로 모아 다시 배포한다.
  schedule:
    - cron: '0 21,9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 관광공사 소개정보(시간·요금)는 호출 한도가 있어 받은 결과를 빌드 사이에 이어 쓴다.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Build
        run: npm run build
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 키를 넣으면 실제 데이터로 바뀐다.
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
          # "지금 많이 찾는 축제": 카카오 REST API 키(다음 블로그 검색). 없으면 그 줄만 숨는다.
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: dist
          include-hidden-files: true

  # Cloudflare Pages(festanow.com)에 올린다. 저장소 시크릿 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID가 필요하다.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=culturemap --branch=main
